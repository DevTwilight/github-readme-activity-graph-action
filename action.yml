name: GitHub Readme Activity Graph Action
description: Generate GitHub Readme Activity Graph in GitHub Actions.
author: maurodesouza

inputs:
  username:
    description: GitHub username to generate the activity graph for.
    required: true

  options:
    description: Options for the card (query string or JSON).
    required: false
    default: ""

  output_path:
    description: Output path for SVG file (relative path; include filename with .svg).
    required: false
    default: ""

  token:
    description: GitHub token (PAT or GITHUB_TOKEN). Falls back to github.token if not provided.
    required: false
    default: ""

outputs:
  path:
    description: Path where the SVG file was written.
    value: ${{ steps.generate.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: 10.12.4

    - name: Setup Node.js
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version-file: "${{ github.action_path }}/.nvmrc"

    - name: Configure pnpm store
      shell: bash
      run: pnpm config set store-dir ~/.pnpm-store

    - name: Cache pnpm store
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ github.action_path }}

    - name: Generate card
      id: generate
      run: pnpm exec tsx src/index.js
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_OPTIONS: ${{ inputs.options }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        TOKEN: ${{ inputs.token || github.token }}

branding:
  icon: bar-chart-2
  color: blue